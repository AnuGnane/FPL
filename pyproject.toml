[project]
name = "gaffer"
version = "0.1.0"
description = "FPL ML advisor: predictions, transfers, captaincy, chips"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "pulp>=2.8",
    "highspy>=1.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "tomli-w>=1.0",
]

[project.scripts]
gaffer = "gaffer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaffer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "gaffer"
version = "0.1.0"
description = "FPL ML advisor: predictions, transfers, captaincy, chips"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "pulp>=2.8",
    "highspy>=1.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "tomli-w>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "qrcode>=7.4",
    "mcp>=2.1.1",
]

[project.scripts]
gaffer = "gaffer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaffer"]
# Non-Python files the package reads at runtime: the report template, the
# offline bootstrap payload the backtest scores against, and the set-piece
# override template `gaffer.assets.load_set_pieces_example` reads.
artifacts = ["src/gaffer/assets/*.json", "src/gaffer/assets/*.svg",
             "src/gaffer/assets/*.toml",
             "src/gaffer/report/templates/*.j2",
             "src/gaffer/web/static/**/*"]

[tool.hatch.build.targets.sdist]
include = ["src/gaffer", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# v17c §2.11: the golden board runs in the default suite; a fast local loop
# deselects it with -m "not golden".
markers = [
    "golden: runs the recorded pipeline (v17c); deselect with -m 'not golden'",
    # v18g §2.5: the five files whose fits cost over 5 s of wall each; the inner
    # loop deselects them with -m "not slow and not golden".
    "slow: fits a model head, so over 5 s of wall (v18g); deselect with -m 'not slow'",
]
# v18g §2.5: 11,032 warnings in a non-golden run drown the summary. Each family
# over 100 is silenced by its message, with the reason; nothing is silenced by
# category alone, so a new family still shows up.
filterwarnings = [
    # PuLP 3.3 deprecates the builders optimize/ uses; 10,927 of the 11,032.
    # Migrate at PuLP 4 (prob.add_variable_dicts).
    'ignore:LpVariable\.dicts is deprecated:DeprecationWarning',
    # 96 more from reading prob.constraints as a mapping. Migrate at PuLP 4
    # (get_constraint_by_name / prob.constraints() as a list).
    'ignore:Using LpProblem\.constraints as a dict mapping is deprecated:DeprecationWarning',
    # 2 from LpVariable(name, ...). Migrate at PuLP 4 (prob.add_variable).
    'ignore:Constructing LpVariable:DeprecationWarning',
    # 1 from the CBC solver handle. Migrate at PuLP 4 (COIN_CMD).
    'ignore:PULP_CBC_CMD is deprecated:DeprecationWarning',
    # 2 from joblib's numpy_pickle loader, not from src/; nothing here to fix.
    'ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib\.numpy_pickle',
]

[tool.ruff]
# v18g §1: E, F, B and I at line 100; the ignores below each carry a reason.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
# B905: zip(strict=) on 174 sites is noise, not safety — every zip here is
# over parallel columns the caller built (v18g §1).
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# E402: these tests import a fixture module after setting a path (v18g §1).
"tests/test_milp.py" = ["E402"]
"tests/test_core_insights.py" = ["E402"]
"tests/test_chips.py" = ["E402"]
"tests/test_understat.py" = ["E402"]
"tests/test_scenarios.py" = ["E402"]
"tests/test_policy.py" = ["E402"]
"tests/test_league.py" = ["E402"]
"tests/test_dixon_coles.py" = ["E402"]
"tests/test_features.py" = ["E402"]
"tests/test_v17e_config.py" = ["E402"]
"tests/test_odds.py" = ["E402"]
"tests/test_match_odds.py" = ["E402"]
# E402: the re-export at the bottom of minutes.py (v5).
"src/gaffer/models/minutes.py" = ["E402"]
# E501: prose sentences and a recorded board asserted verbatim (v18g §1).
"tests/test_v16_brief.py" = ["E501"]
"tests/test_golden_board.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# B008: typer's declarative defaults are the CLI's idiom (v18g §2.1).
extend-immutable-calls = ["typer.Option", "typer.Argument"]

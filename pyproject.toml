[project]
name = "gaffer"
version = "0.1.0"
description = "FPL ML advisor: predictions, transfers, captaincy, chips"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "pulp>=2.8",
    "highspy>=1.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "tomli-w>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "qrcode>=7.4",
    "mcp>=2.1.1",
]

[project.scripts]
gaffer = "gaffer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaffer"]
# Non-Python files the package reads at runtime: the report template, the
# offline bootstrap payload the backtest scores against, and the set-piece
# override template `gaffer.assets.load_set_pieces_example` reads.
artifacts = ["src/gaffer/assets/*.json", "src/gaffer/assets/*.svg",
             "src/gaffer/assets/*.toml",
             "src/gaffer/report/templates/*.j2",
             "src/gaffer/web/static/**/*"]

[tool.hatch.build.targets.sdist]
include = ["src/gaffer", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# holiday F-132: an unregistered marker fails collection, so a misspelt
# -m "not slwo" in the inner loop cannot deselect nothing and say nothing.
addopts = "--strict-markers"
# v17c §2.11: the golden board runs in the default suite; a fast local loop
# deselects it with -m "not golden".
markers = [
    "golden: runs the recorded pipeline (v17c); deselect with -m 'not golden'",
    # v18g §2.5: the five files whose fits cost over 5 s of wall each; the inner
    # loop deselects them with -m "not slow and not golden".
    "slow: fits a model head, so over 5 s of wall (v18g); deselect with -m 'not slow'",
]
# v18g §2.5: 11,032 warnings in a non-golden run drown the summary. Each family
# over 100 is silenced by its message, with the reason; nothing is silenced by
# category alone, so a new family still shows up.
filterwarnings = [
    # holiday F-184: a new family fails the test that raises it, rather than
    # showing up in a summary line nobody reads; the ignores below still apply.
    "error",
    # PuLP 3.3 deprecates the builders optimize/ uses; 10,927 of the 11,032.
    # Migrate at PuLP 4 (prob.add_variable_dicts).
    'ignore:LpVariable\.dicts is deprecated:DeprecationWarning',
    # 96 more from reading prob.constraints as a mapping. Migrate at PuLP 4
    # (get_constraint_by_name / prob.constraints() as a list).
    'ignore:Using LpProblem\.constraints as a dict mapping is deprecated:DeprecationWarning',
    # 2 from LpVariable(name, ...). Migrate at PuLP 4 (prob.add_variable).
    'ignore:Constructing LpVariable:DeprecationWarning',
    # 1 from the CBC solver handle. Migrate at PuLP 4 (COIN_CMD).
    'ignore:PULP_CBC_CMD is deprecated:DeprecationWarning',
    # 2 from joblib's numpy_pickle loader, not from src/; nothing here to fix.
    'ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib\.numpy_pickle',
]

[tool.ruff]
# v18g §1: E, F, B, I, UP, SIM, C4, PIE, RET and ERA at line 100 (UP since
# holiday F-188, SIM since F-189, C4, PIE, RET and ERA since F-201); the
# ignores below each carry a reason.
line-length = 100
target-version = "py312"
# F-167: scripts/archive/ is the retired code v18g moved out of the way; it is
# kept for the record, not run, so the scripts gate skips it.
extend-exclude = ["scripts/archive"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "C4", "PIE", "RET", "ERA"]
# B905: zip(strict=) on 174 sites is noise, not safety — every zip here is
# over parallel columns the caller built (v18g §1).
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# E402: these tests import a fixture module after setting a path (v18g §1).
"tests/test_milp.py" = ["E402"]
"tests/test_core_insights.py" = ["E402"]
"tests/test_chips.py" = ["E402"]
"tests/test_understat.py" = ["E402"]
"tests/test_scenarios.py" = ["E402"]
"tests/test_policy.py" = ["E402"]
"tests/test_league.py" = ["E402"]
"tests/test_dixon_coles.py" = ["E402"]
"tests/test_features.py" = ["E402"]
"tests/test_v17e_config.py" = ["E402"]
"tests/test_odds.py" = ["E402"]
"tests/test_match_odds.py" = ["E402"]
# E402: the re-export at the bottom of minutes.py (v5).
"src/gaffer/models/minutes.py" = ["E402"]
# E501: prose sentences and a recorded board asserted verbatim (v18g §1).
"tests/test_v16_brief.py" = ["E501"]
"tests/test_golden_board.py" = ["E501"]
# I001: s2_replay.py is orchestrator-only (CLAUDE.md), so F-167 leaves its
# import order as it stands rather than sorting it.
"scripts/s2_replay.py" = ["I001"]
# UP (holiday F-188): the golden modules are on the Mac's golden path
# (HOLIDAY.md Merging rule 2), so their sites wait for F-190's needs-mac PR.
"src/gaffer/pipeline.py" = ["UP"]
"src/gaffer/config.py" = ["UP"]
"src/gaffer/artifacts.py" = ["UP"]
"src/gaffer/brief.py" = ["UP"]
"src/gaffer/web/job_kinds.py" = ["UP"]
# UP (holiday F-188): orchestrator-only files (CLAUDE.md) keep their spelling
# for good; the orchestrator owns their diffs.
"src/gaffer/advise.py" = ["UP", "C4", "PIE", "RET", "ERA"]
"src/gaffer/web/jobs.py" = ["UP"]
"tests/test_v9d_degradation.py" = ["UP"]
# C4, PIE, RET and ERA (holiday F-201): ladder.py, served.py and web/app.py
# are on the Mac's golden path (HOLIDAY.md Merging rule 2; app.py through
# tests/golden_client.py), so their sites wait for F-202's needs-mac PR.
"src/gaffer/served.py" = ["C4", "PIE", "RET", "ERA"]
"src/gaffer/web/app.py" = ["C4", "PIE", "RET", "ERA"]
# C4, PIE, RET and ERA (holiday F-201): orchestrator-only files (CLAUDE.md)
# keep their spelling for good, as F-188's advise.py line does.
"tests/test_v4c_degradation.py" = ["C4", "PIE", "RET", "ERA"]
"tests/test_v11_degradation.py" = ["C4", "PIE", "RET", "ERA"]
"tests/test_v12_w1_degradation.py" = ["C4", "PIE", "RET", "ERA"]
"tests/test_v12_w3_degradation.py" = ["C4", "PIE", "RET", "ERA"]
"tests/test_v12_w4_degradation.py" = ["C4", "PIE", "RET", "ERA"]
"tests/test_v12_w5_degradation.py" = ["C4", "PIE", "RET", "ERA"]
"tests/test_v19_degradation.py" = ["C4", "PIE", "RET", "ERA"]
"tests/test_web_job_kinds_v8b.py" = ["C4", "PIE", "RET", "ERA"]
"tests/test_web_job_kinds_v8f.py" = ["C4", "PIE", "RET", "ERA"]
# SIM (holiday F-189): ladder.py is golden, its site waits for F-190 on the
# Mac; milp.py and the two tests are orchestrator-only (CLAUDE.md) for good.
# C4, PIE, RET and ERA (holiday F-201) likewise: ladder.py's sites wait for
# F-202 on the Mac, and the three orchestrator-only files keep theirs for good.
"src/gaffer/ladder.py" = ["UP", "SIM", "C4", "PIE", "RET", "ERA"]
"src/gaffer/optimize/milp.py" = ["UP", "SIM", "C4", "PIE", "RET", "ERA"]
"tests/test_advise.py" = ["UP", "SIM", "C4", "PIE", "RET", "ERA"]
"tests/test_v10_degradation.py" = ["SIM", "C4", "PIE", "RET", "ERA"]
# SIM (holiday F-189): features/ sits on the golden path (F-18, F-81, F-92),
# so engineer.py's one site waits for F-190 on the Mac with the six modules.
"src/gaffer/features/engineer.py" = ["SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008: typer's declarative defaults are the CLI's idiom (v18g §2.1).
extend-immutable-calls = ["typer.Option", "typer.Argument"]

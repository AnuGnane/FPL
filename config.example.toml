[fpl]
entry_id = 0        # your FPL team ID
league_id = 0       # your mini-league ID

[optimizer]
horizon = 3          # 2025/26 sweep: fewest hits (11 vs 17-18), score tied with h1; h6 chases noise
decay = 0.85
vice_weight = 0.1
bench_weight = 0.10
ft_value = 1.5
itb_value = 0.08          # O'Brien: £1m ~ +21.8 pts over half a season; gate D2
ft_use_penalty = 0.2
bench_curve = [0.21, 0.06, 0.002]
hit_cost = 4

[scenarios]
# n = 0 disables the sweep and solves once, deterministically. `gaffer advise
# --fast` and the UI's Fast advise button do that per-run without editing this.
n = 40               # gate D1: gated replay 1818 vs raw 1743 (+75), fewer transfers and hits
decision_priors = true

[odds]
# api_key = "get one free at the-odds-api.com (500 requests/month)"

[data]
train_seasons = ["2022-23", "2023-24", "2024-25", "2025-26"]
current_season = "2026-27"

[news]
# Live availability. Every source degrades to the official FPL flags on its
# own, so these switch off a *working* source rather than rescue a broken one.
enabled = true
injuries = true            # premierinjuries.com injury table
lineups = true             # Fantasy Football Scout predicted XIs
cache_hours = 6
min_coverage = 0.5         # share of a source's rows that must match a player

# v8a: a regular left out of a published predicted XI is evidence against him
# even though the page never names him. Damps the imminent gameweek only.
lineup_absence = true
lineup_absence_damp = 0.75
# A floor under a predicted starter's p_play. 0.0 is off, and it ships off:
# floors can only raise a number, and no evidence supports one yet.
lineup_start_floor = 0.0

# v8a: the presser/quote classifier, run through a headless CLI on your own
# subscription. Shadow-only by default — it logs what it would have done to
# data/live/presser_log.parquet and changes no advice.
llm_classifier = false
llm_shadow = true
# No tools: the texts it reads are scraped web content, and a classifier
# that only ever returns one word from a fixed list needs no hands.
llm_command = 'claude -p --output-format json --disallowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Task,NotebookEdit"'
llm_timeout_s = 120

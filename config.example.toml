[fpl]
entry_id = 0        # your FPL team ID
league_id = 0       # your mini-league ID

[optimizer]
horizon = 3          # 2025/26 sweep: fewest hits (11 vs 17-18), score tied with h1; h6 chases noise
decay = 0.85
vice_weight = 0.1
bench_weight = 0.10
ft_value = 1.5
itb_value = 0.08          # O'Brien: £1m ~ +21.8 pts over half a season; gate D2
# v12 §3.4: charge a deferred sale its expected overnight drop — a 0.008-point tie-breaker, on since the 2026-09-02 gate replayed byte-identical to main.
price_timing = true
ft_use_penalty = 0.2
bench_curve = [0.21, 0.06, 0.002]
hit_cost = 4
# How far behind the recommended plan an alternative may sit and still be
# shown as Plan B or Plan C, in the solver's own objective points — which
# discount later weeks and price banked transfers, so this is not a raw xPts
# gap. 0 turns the search off; each alternative costs one more MILP solve.
alt_plan_max_gap = 2.0
# v12: how many players per position the MILP may consider, on top of the ones
# you already own. These four numbers have decided the candidate pool since the
# first solve and lived only in the source until now; they are here so that "he
# was never in the pool" and "he was considered and rejected" are
# distinguishable. Smaller is faster and blinder. A missing position keeps the
# value below and anything unreadable falls back to it too — a typo must not
# quietly shrink the pool.
top_n = { GKP = 8, DEF = 22, MID = 26, FWD = 14 }

[model]
# v12 §3.5: non-penalty xG per shot on the attacking model — off, because the replay with it on lost 28 points on the mean.
xg_per_shot = false

[scenarios]
# n = 0 disables the sweep and solves once, deterministically. `gaffer advise
# --fast` and the UI's Fast advise button do that per-run without editing this.
n = 40               # gate D1: gated replay 1818 vs raw 1743 (+75), fewer transfers and hits
decision_priors = true
# Per scenario, draw whether each player turned out at all (Bernoulli on the
# minutes model's p_play) before the EP noise is applied. "Did he play" is
# most of FPL's forecast error, and a sweep that only widened the EP band was
# asking a softer question. Off is the pre-v12 sweep exactly.
# On since the 2026-09-02 §4.4 support gate: captain support on the GW3 board
# fell 60.0 -> 52.5 with the draw on (drop 7.5, ceiling 10; 40/40 scenarios in
# both arms). Set false to sweep on expected minutes only.
draw_availability = true

[odds]
# api_key = "get one free at the-odds-api.com (500 requests/month)"

[league]
# League mode is gated by fpl.league_id, not by a switch here: set that and
# the tilt turns on. These are its dials, and every one of them ships at the
# value below — this section exists to name them, not to change them.
z_scale = 1.5             # points of gap per unit of z before the tilt moves
lambda_cap = 0.5          # the most the tilt may ever bend the board
sigma_floor = 8.0         # weekly points sigma the gap is measured in...
sigma_cap = 30.0          # ...clamped both ends, because a short season
sigma_min_weeks = 6       # gameweeks of history before sigma is estimated
z_deadband = 0.25         # |z| under this is noise: no tilt at all

# The top-10k sample. tier_eo is the live tracker's EO column; field_scrape
# is v8c's scheduled version of the same fetch, which also keeps the sampled
# squads (anonymously) so the league Monte Carlo has a field to drift toward.
tier_eo = true
tier_sample = 300
field_scrape = true
field_sample = 300        # defaults to tier_sample when unset

# The mini-league Monte Carlo behind /api/league/sim.
sim_n = 2000              # simulations per run; 2000 is ~1s at league size 50
# How far a rival's squad drifts toward the field template over the run.
# 0.0 freezes every rival's current squad — the analytic sanity case.
rival_drift = 0.5

[data]
train_seasons = ["2022-23", "2023-24", "2024-25", "2025-26"]
current_season = "2026-27"

[news]
# Live availability. Every source degrades to the official FPL flags on its
# own, so these switch off a *working* source rather than rescue a broken one.
enabled = true
injuries = true            # premierinjuries.com injury table
lineups = true             # predicted XIs, merged pessimistically
# v10: which predicted-XI sources to read, in this order. Omitted, both run.
# An empty list is the same as `lineups = false`. Use it to switch off a
# source that is parsing cleanly and saying something false — the coarse
# switch above already covers a source that has simply gone quiet.
# lineup_providers = ["ffs", "rotowire"]
cache_hours = 6
min_coverage = 0.5         # share of a source's rows that must match a player

# v8a: a regular left out of a published predicted XI is evidence against him
# even though the page never names him. Damps the imminent gameweek only.
lineup_absence = true
lineup_absence_damp = 0.75
# A floor under a predicted starter's p_play. 0.0 is off, and it ships off:
# floors can only raise a number, and no evidence supports one yet.
lineup_start_floor = 0.0

# v8a: the presser/quote classifier, run through a headless CLI on your own
# subscription. Shadow-only by default — it logs what it would have done to
# data/live/presser_log.parquet and changes no advice.
llm_classifier = false
llm_shadow = true
# No tools: the texts it reads are scraped web content, and a classifier
# that only ever returns one word from a fixed list needs no hands.
llm_command = 'claude -p --output-format json --disallowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Task,NotebookEdit"'
# Seconds per batch of 40. A headless CLI on a consumer subscription is
# minutes, not seconds, and a timeout looks exactly like a dead classifier.
llm_timeout_s = 300

# v8e: your own pins on a player's p_play / expected minutes, set from the
# Players page or the Planning hub and stored in reports/overrides.json.
# They are applied last, over every automated source, because you are the one
# who watched the press conference. An empty store changes nothing.
overrides = true

[digest]
# v8f: the Friday briefing and the Tuesday debrief, delivered as a macOS
# notification when the launchd job writes them. On by default, for the reason
# the override switch is: a notification nobody has to enable is the whole
# feature, and a switch that must be found before the tool works is a feature
# nobody finds. Set it false on a machine that is not your own — a server, a
# CI box, a shared laptop — where a scheduled job firing Notification Centre
# would be somebody else's surprise.
notify = true

[backup]
# `gaffer backup` tars data/live/, data/raw/field/, data/raw/tier_eo/,
# reports/ and models/ — roughly 16 MB, so `keep = 14` is a few hundred
# megabytes of archives rather than a few gigabytes. data/history/,
# data/raw/understat/, data/raw/vaastav/ and data/raw/news/ are left out
# because a command rebuilds each of them; the sampled top-10k squads under
# data/raw/field/ are in, because nothing can.
# dir = "~/gaffer-backups"        # the default
# rsync_target = "nas:/volume1/backups/gaffer"
keep = 14

[web]
# Only consulted by `gaffer ui --lan`. On loopback there is no token and no
# check — the interface is the security model. On the network, every non-GET
# request needs `X-Gaffer-Token: <this>`; leave it unset and one is generated
# and printed each time you start, which is fine for a phone you are about to
# scan a QR code with and awkward for a bookmark.
# token = "something long and private"

# ---------------------------------------------------------------------------
# config.local.toml (v12 W5 §6.2)
#
# An optional file beside this one. Every table in it is merged over the same
# table here, key by key, after this file is read — so it can override one
# setting without restating the section, and it can add a section this file
# never declared.
#
# The Settings tab in the web UI writes it. It never reads or writes
# config.toml, which holds the odds API key.
#
# A key in [optimizer] or [data] that is not a config field is ignored with a
# printed line rather than crashing the run; the same is true of a file that
# will not parse.
# ---------------------------------------------------------------------------

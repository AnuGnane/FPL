# EPL head-coach spells, 2022-07-01 -> present.
#
# One [[spell]] per manager per club. Half-open: a spell covers
# start_date <= match < end_date, so a successor's start_date is his
# predecessor's end_date and no match is claimed twice. end_date = ""
# means "still in post". Caretakers of under four league matches are folded
# into the successor's spell.
#
# team_code is the FPL club code (the one player_gw.parquet carries), not
# the season-scoped team id.
#
# Clubs are covered for the seasons they appear in the frame (2022-23 ..
# 2026-27). A spell that began before 2022-07-01 keeps its real start_date.
# Second-tier spells are carried only where they run continuously into a
# Premier League season (Farke at Leeds, Parker at Burnley, McKenna at
# Ipswich, Le Bris at Sunderland, Lampard at Coventry, Jakirovic at Hull),
# so that no promoted club's opening fixtures fall outside a spell.
#
# Where a manager's departure date is itself a matchday, or a caretaker with
# fewer than four league matches sat in between, the boundary is set to the
# successor's start so that every match in the frame is claimed exactly once.

# --- Manchester United (1) -------------------------------------------------

